<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Lớp Học & Thi Offline</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary px-4">
        <a class="navbar-brand fw-bold" href="/dashboard">📚 LMS & Thi Offline</a>
        {% if session.get('full_name') %}
        <div class="text-white">
            Xin chào, <b>{{ session['full_name'] }}</b> 
            <span class="badge bg-light text-primary ms-1">{{ session['role'] | upper }}</span>
            <a href="/logout" class="btn btn-sm btn-warning ms-3">Đăng xuất</a>
        </div>
        {% endif %}
    </nav>
    <div class="container mt-4 mb-5">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
