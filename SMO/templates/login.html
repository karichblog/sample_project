{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 card p-4 shadow">
        <h4 class="text-center mb-3 text-primary fw-bold">Đăng Nhập Hệ Thống Offline</h4>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label">Tên đăng nhập</label>
                <input type="text" name="username" class="form-control" placeholder="admin / gv1 / hs1" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Mật khẩu</label>
                <input type="password" name="password" class="form-control" placeholder="123" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Đăng nhập</button>
        </form>
        <div class="mt-3 text-muted small">
            <b>Tài khoản mẫu</b> (hãy đổi mật khẩu sau khi triển khai):<br>
            - Quản trị: <code>admin</code> / <code>123</code><br>
            - Giáo viên: <code>gv1</code> / <code>123</code><br>
            - Học sinh: <code>hs1</code> / <code>123</code>
        </div>
    </div>
</div>
{% endblock %}
